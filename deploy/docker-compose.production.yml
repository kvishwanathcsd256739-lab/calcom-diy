services:
  calcom-database:
    image: postgres:16-alpine
    container_name: calcom-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calcom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calendso}
    volumes:
      - calcom_postgres_data:/var/lib/postgresql/data
    networks:
      - calcom-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calcom_user} -d ${POSTGRES_DB:-calendso}"]
      interval: 10s
      timeout: 5s
      retries: 5

  calcom-redis:
    image: redis:alpine
    container_name: calcom-redis
    restart: unless-stopped
    volumes:
      - calcom_redis_data:/data
    networks:
      - calcom-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calcom-web:
    image: calcom/cal.com:latest
    container_name: calcom-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CRON_API_KEY: ${CRON_API_KEY}
      REDIS_URL: ${REDIS_URL}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      NODE_ENV: production
    depends_on:
      calcom-database:
        condition: service_healthy
      calcom-redis:
        condition: service_healthy
    networks:
      - calcom-net
      - oci_excalidraw-net
    expose:
      - "3000"

volumes:
  calcom_postgres_data:
  calcom_redis_data:

networks:
  calcom-net:
    driver: bridge
  oci_excalidraw-net:
    external: true
